    <meta name="theme-color" content="#0a0e14" />

    <style>
      :root {
        --bg: #0a0e14;
        --text: #c8d0d8;
        --header: #47729c;
        --border: #1e2a38;
        --system: #9ba4ad;
        --system-prefix: #3a4a5a;
        --ai: #7ec8e3;
        --ai-prefix: #4a8aa3;
        --captain: #d4a05a;
        --captain-prefix: #a07030;
        --doctor: #b8a0d4;
        --doctor-prefix: #7a60a0;
        --unknown: #d45a8a;
        --unknown-prefix: #8a3058;
        --log-entry: #a8b0a0;
        --log-border: #2a3a2a;
        --log-prefix: #4a6a4a;
        --danger: #d45a5a;
        --danger-prefix: #8a3030;
        --warning: #d4a05a;
        --warning-prefix: #8a6030;
        --choice: #8ad48a;
        --choice-prefix: #4a8a4a;
        --btn-border: #2a3a4a;
        --btn-text: #8ab8d4;
        --btn-hover-bg: #101820;
        --btn-hover-border: #4a6a8a;
        --btn-hover-text: #c8e8ff;
        --danger-btn-border: #4a2020;
        --danger-btn-text: #d47a7a;
        --danger-btn-hover-bg: #1a0e0e;
        --danger-btn-hover-border: #8a3030;
        --danger-btn-hover-text: #ff9a9a;
        --moral-btn-border: #204a30;
        --moral-btn-text: #7ad49a;
        --moral-btn-hover-bg: #0e1a12;
        --moral-btn-hover-border: #308a50;
        --moral-btn-hover-text: #9affba;
        --risky-btn-border: #4a3a10;
        --risky-btn-text: #d4c07a;
        --risky-btn-hover-bg: #1a1508;
        --risky-btn-hover-border: #8a7020;
        --risky-btn-hover-text: #ffe8a0;
        --timer-bg: #1e2a38;
        --scroll-thumb: #1e2a38;
      }
      body[data-theme="light"] {
        --bg: #f5f2ea;
        --text: #2a2a2a;
        --header: #8a7a6a;
        --border: #d8d0c0;
        --system: #6a6a6a;
        --system-prefix: #9a9a9a;
        --ai: #2a6a9a;
        --ai-prefix: #1a4a6a;
        --captain: #a06020;
        --captain-prefix: #704010;
        --doctor: #6a4a9a;
        --doctor-prefix: #4a2a6a;
        --unknown: #b03060;
        --unknown-prefix: #801040;
        --log-entry: #4a5a4a;
        --log-border: #b8c8b8;
        --log-prefix: #5a7a5a;
        --danger: #b03030;
        --danger-prefix: #801010;
        --warning: #a07020;
        --warning-prefix: #704010;
        --choice: #2a7a3a;
        --choice-prefix: #1a5a2a;
        --btn-border: #c0b8a8;
        --btn-text: #2a5a8a;
        --btn-hover-bg: #ebe5d8;
        --btn-hover-border: #8a7a5a;
        --btn-hover-text: #1a3a5a;
        --danger-btn-border: #c0a0a0;
        --danger-btn-text: #a04040;
        --danger-btn-hover-bg: #f0e0e0;
        --danger-btn-hover-border: #a04040;
        --danger-btn-hover-text: #801010;
        --moral-btn-border: #a0c0a8;
        --moral-btn-text: #2a7a4a;
        --moral-btn-hover-bg: #e0f0e5;
        --moral-btn-hover-border: #3a8a5a;
        --moral-btn-hover-text: #1a5a2a;
        --risky-btn-border: #c0b090;
        --risky-btn-text: #8a7020;
        --risky-btn-hover-bg: #f0ead0;
        --risky-btn-hover-border: #a08020;
        --risky-btn-hover-text: #604010;
        --timer-bg: #d8d0c0;
        --scroll-thumb: #c0b8a8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px;
        transition:
          background 0.3s,
          color 0.3s;
      }
      #game {
        max-width: 720px;
        width: 100%;
        display: flex;
        flex-direction: column;
        min-height: 90vh;
        transition: opacity 1.5s;
      }
      #game.blackout {
        opacity: 0;
        pointer-events: none;
      }
      #header {
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--header);
        letter-spacing: 1px;
        text-transform: uppercase;
        transition:
          border-color 0.3s,
          color 0.3s;
        flex-wrap: wrap;
        gap: 8px;
      }
      #header-left {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      #header-right {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      #journal-btn {
        font-size: 12px;
        color: var(--log-prefix);
        letter-spacing: 1px;
        cursor: pointer;
        padding: 2px 6px;
        border: 1px solid transparent;
        border-radius: 2px;
        background: transparent;
        font-family: inherit;
        text-transform: none;
        transition: all 0.2s;
      }
      #journal-btn:hover {
        border-color: var(--log-prefix);
        background: var(--btn-hover-bg);
        color: var(--log-entry);
      }
      #doctor-indicator {
        font-size: 12px;
        color: var(--doctor);
        letter-spacing: 1px;
        cursor: pointer;
        padding: 2px 6px;
        border: 1px solid transparent;
        border-radius: 2px;
        transition: all 0.2s;
      }
      #doctor-indicator:hover {
        border-color: var(--doctor);
        background: var(--btn-hover-bg);
      }
      .header-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header);
        font-family: inherit;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: all 0.2s;
        border-radius: 2px;
        text-transform: uppercase;
      }
      .header-btn:hover {
        border-color: var(--btn-hover-border);
        color: var(--btn-hover-text);
        background: var(--btn-hover-bg);
      }
      #status.danger {
        color: var(--danger);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding-right: 10px;
        margin-bottom: 20px;
      }
      #log::-webkit-scrollbar {
        width: 4px;
      }
      #log::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }
      .msg {
        margin-bottom: 14px;
        animation: fade 0.4s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .system::before {
        content: var(--prefix-system, "[СИСТЕМА] ");
        color: var(--system-prefix);
      }
      .ai {
        color: var(--ai);
      }
      .ai::before {
        content: var(--prefix-ai, "ПАСТОР: ");
        color: var(--ai-prefix);
        font-weight: bold;
      }
      .captain {
        color: var(--captain);
      }
      .captain::before {
        content: var(--prefix-captain, "КАПИТАН: ");
        color: var(--captain-prefix);
        font-weight: bold;
      }
      .doctor {
        color: var(--doctor);
      }
      .doctor::before {
        content: var(--prefix-doctor, "ДОКТОР: ");
        color: var(--doctor-prefix);
        font-weight: bold;
      }
      .unknown {
        color: var(--unknown);
      }
      .unknown::before {
        content: "???: ";
        color: var(--unknown-prefix);
        font-weight: bold;
      }
      .log-entry {
        color: var(--log-entry);
        border-left: 2px solid var(--log-border);
        padding-left: 14px;
        margin: 14px 0;
        font-style: italic;
      }
      .log-entry::before {
        content: var(--prefix-journal, "▸ ЗАПИСЬ ЖУРНАЛА");
        display: block;
        color: var(--log-prefix);
        font-style: normal;
        font-size: 12px;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }
      .danger {
        color: var(--danger);
      }
      .danger::before {
        content: var(--prefix-danger, "[ВНИМАНИЕ] ");
        color: var(--danger-prefix);
      }
      .warning {
        color: var(--warning);
      }
      .warning::before {
        content: var(--prefix-warning, "[ТРЕВОГА] ");
        color: var(--warning-prefix);
      }
      .choice {
        color: var(--choice);
        margin-top: 4px;
      }
      .choice::before {
        content: "> ";
        color: var(--choice-prefix);
      }
      #timer-widget {
        display: none;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--btn-hover-bg);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      #timer-widget.visible {
        display: flex;
      }
      #timer-widget.critical {
        border-color: var(--danger);
        animation: pulse 0.6s infinite;
      }
      #timer-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      #timer-label {
        color: var(--warning);
      }
      #timer-widget.critical #timer-label {
        color: var(--danger);
      }
      #timer-digits {
        color: var(--warning);
        font-weight: bold;
        font-size: 16px;
      }
      #timer-widget.critical #timer-digits {
        color: var(--danger);
      }
      #timer-bar-track {
        height: 10px;
        background: var(--timer-bg);
        border-radius: 5px;
        overflow: hidden;
      }
      #timer-fill {
        height: 100%;
        width: 100%;
        background: var(--warning);
        border-radius: 5px;
        transition:
          width 0.08s linear,
          background 0.3s;
      }
      #timer-fill.critical {
        background: var(--danger);
      }
      #controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
        transition: border-color 0.3s;
      }
      #controls button {
        animation: fade 0.3s ease;
      }
      button {
        background: transparent;
        border: 1px solid var(--btn-border);
        color: var(--btn-text);
        font-family: inherit;
        font-size: 15px;
        padding: 12px 16px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 2px;
        position: relative;
      }
      button:hover {
        background: var(--btn-hover-bg);
        border-color: var(--btn-hover-border);
        color: var(--btn-hover-text);
        padding-left: 22px;
      }
      button:active {
        transform: scale(0.99);
      }
      button.danger-btn {
        border-color: var(--danger-btn-border);
        color: var(--danger-btn-text);
      }
      button.danger-btn:hover {
        background: var(--danger-btn-hover-bg);
        border-color: var(--danger-btn-hover-border);
        color: var(--danger-btn-hover-text);
      }
      button.moral-btn {
        border-color: var(--moral-btn-border);
        color: var(--moral-btn-text);
      }
      button.moral-btn:hover {
        background: var(--moral-btn-hover-bg);
        border-color: var(--moral-btn-hover-border);
        color: var(--moral-btn-hover-text);
      }
      button.risky-btn {
        border-color: var(--risky-btn-border);
        color: var(--risky-btn-text);
      }
      button.risky-btn:hover {
        background: var(--risky-btn-hover-bg);
        border-color: var(--risky-btn-hover-border);
        color: var(--risky-btn-hover-text);
      }
      .restart {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        color: var(--header);
      }
      .restart button {
        text-align: center;
        width: 100%;
      }
      #blackout-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 100;
        padding: 20px;
        opacity: 0;
        transition: opacity 1.5s;
      }
      #blackout-overlay.active {
        display: flex;
        opacity: 1;
      }
      #blackout-text {
        color: #4a5a6a;
        font-family: "Courier New", Courier, monospace;
        font-size: 14px;
        letter-spacing: 2px;
        text-align: center;
        max-width: 600px;
        line-height: 2;
        opacity: 0;
        transition: opacity 2s;
      }
      #blackout-text.visible {
        opacity: 1;
      }
      #skip-blackout {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: transparent;
        border: 1px solid #2a3a4a;
        color: #4a5a6a;
        font-size: 12px;
        padding: 6px 12px;
        cursor: pointer;
        letter-spacing: 1px;
        z-index: 101;
        display: none;
      }
      #skip-blackout.visible {
        display: block;
      }
      #skip-blackout:hover {
        color: #8a9aaa;
        border-color: #4a5a6a;
      }
      #doctor-modal,
      #export-modal,
      #journal-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #doctor-modal {
        background: rgba(0, 0, 0, 0.8);
      }
      #export-modal {
        background: rgba(0, 0, 0, 0.85);
      }
      #journal-modal {
        background: rgba(0, 0, 0, 0.8);
      }
      #doctor-modal.active,
      #export-modal.active,
      #journal-modal.active {
        display: flex;
        opacity: 1;
      }
      #journal-panel {
        background: var(--bg);
        border: 1px solid var(--log-prefix);
        max-width: 560px;
        width: 100%;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        padding: 24px;
        border-radius: 2px;
        position: relative;
      }
      #journal-title {
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--log-prefix);
        margin-bottom: 4px;
        text-align: center;
      }
      #journal-subtitle {
        font-size: 12px;
        color: var(--header);
        margin-bottom: 14px;
        text-align: center;
        letter-spacing: 1px;
      }
      #journal-list {
        flex: 1;
        overflow-y: auto;
        padding-right: 6px;
      }
      #journal-list::-webkit-scrollbar {
        width: 4px;
      }
      #journal-list::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }
      .journal-item {
        border-left: 2px solid var(--log-border);
        padding: 10px 0 10px 14px;
        margin-bottom: 14px;
      }
      .journal-item:last-child {
        margin-bottom: 0;
      }
      .journal-item-head {
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--log-prefix);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .journal-item-text {
        font-size: 14px;
        line-height: 1.6;
        color: var(--log-entry);
        font-style: italic;
      }
      #journal-empty {
        font-size: 13px;
        color: var(--system);
        text-align: center;
        padding: 20px 0;
        font-style: italic;
      }
      #journal-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header);
        font-size: 14px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        border-radius: 2px;
        padding: 0;
        text-align: center;
        line-height: 1;
      }
      #journal-close:hover {
        color: var(--danger);
        border-color: var(--danger);
      }
      #doctor-panel {
        background: var(--bg);
        border: 1px solid var(--doctor);
        max-width: 480px;
        width: 100%;
        padding: 24px;
        border-radius: 2px;
        position: relative;
      }
      #doctor-title {
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--doctor);
        margin-bottom: 12px;
        text-align: center;
      }
      #doctor-body {
        font-size: 14px;
        line-height: 1.6;
        color: var(--text);
      }
      #doctor-body p {
        margin-bottom: 10px;
      }
      #doctor-body strong {
        color: var(--doctor);
      }
      #doctor-status-line {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 13px;
        color: var(--system);
      }
      #doctor-close,
      #export-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header);
        font-size: 14px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        border-radius: 2px;
        padding: 0;
        text-align: center;
        line-height: 1;
      }
      #doctor-close:hover,
      #export-close:hover {
        color: var(--danger);
        border-color: var(--danger);
      }
      #export-panel {
        background: var(--bg);
        border: 1px solid var(--border);
        max-width: 720px;
        width: 100%;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        padding: 20px;
        border-radius: 2px;
        position: relative;
      }
      #export-title {
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--ai);
        margin-bottom: 4px;
      }
      #export-subtitle {
        font-size: 12px;
        color: var(--header);
        margin-bottom: 14px;
        letter-spacing: 1px;
      }
      #export-preview {
        flex: 1;
        overflow-y: auto;
        background: var(--btn-hover-bg);
        border: 1px solid var(--border);
        padding: 14px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
        color: var(--text);
        max-height: 50vh;
        font-family: "Courier New", Courier, monospace;
        border-radius: 2px;
      }
      #export-preview::-webkit-scrollbar {
        width: 4px;
      }
      #export-preview::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }
      #export-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      #export-actions button {
        flex: 1;
        min-width: 140px;
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body data-theme="dark">
    <div id="blackout-overlay">
      <div id="blackout-text"></div>
      <button id="skip-blackout"></button>
    </div>

    <div id="journal-modal" role="dialog" aria-modal="true" aria-labelledby="journal-title">
      <div id="journal-panel">
        <button id="journal-close">✕</button>
        <div id="journal-title"></div>
        <div id="journal-subtitle"></div>
        <div id="journal-list"></div>
      </div>
    </div>

    <div id="doctor-modal" role="dialog" aria-modal="true">
      <div id="doctor-panel">
        <button id="doctor-close">✕</button>
        <div id="doctor-title"></div>
        <div id="doctor-body"></div>
        <div id="doctor-status-line">
          <span id="doctor-status-label"></span>
          <span id="doctor-status-text"></span>
        </div>

      /* ============================================================
         10. ТАЙМЕР
         ============================================================ */
      const Timer = (() => {
        let rafId = null;
        let active = false;
        let _remaining = 0;
        let _total = 0;
        let _onTimeout = null;

        function start(seconds, onTimeout) {
          stop();
          active = true;
          _total = seconds * 1000;
          _remaining = _total;
          _onTimeout = onTimeout;
          DOM.timerWidget.classList.add("visible");
          DOM.timerFill.style.width = "100%";
          DOM.timerFill.classList.remove("critical");
          DOM.timerWidget.classList.remove("critical");
          DOM.status.classList.remove("danger");
          updateStatus();
          const startTime = Date.now();
          function tick() {
            if (!active) return;
            _remaining = Math.max(0, _total - (Date.now() - startTime));
            const pct = (_remaining / _total) * 100;
            const secs = Math.ceil(_remaining / 1000);
            DOM.timerFill.style.width = pct + "%";
            DOM.timerDigits.textContent = secs + " " + L().timerSec;
            const critical = secs <= 3;
            if (critical) {
              DOM.timerFill.classList.add("critical");
              DOM.timerWidget.classList.add("critical");
              DOM.status.textContent = L().statusCritical;
              DOM.status.classList.add("danger");
            } else {
              DOM.timerFill.classList.remove("critical");
              DOM.timerWidget.classList.remove("critical");
            }
            if (_remaining <= 0) {
              stop();
              addMsg(L().timeUp, "danger");
              record("timeout", { message: { ru: I18N.ru.timeUpRecord, en: I18N.en.timeUpRecord } });
              clearControls();
              _onTimeout && _onTimeout();
              return;
            }
            rafId = requestAnimationFrame(tick);
          }
          rafId = requestAnimationFrame(tick);
        }

        function getRemaining() {
          return active ? _remaining : 0;
        }
        function isActive() {
          return active;
        }

        function resumeFrom(ms, onTimeout) {
          stop();
          if (!ms || ms <= 0) {
            DOM.timerWidget.classList.add("visible");
            DOM.timerFill.style.width = "0%";
            DOM.timerDigits.textContent = "0 " + L().timerSec;
            DOM.timerFill.classList.add("critical");
            DOM.timerWidget.classList.add("critical");
            active = false;
            setTimeout(() => {
              addMsg(L().timeUp, "danger");
              record("timeout", { message: { ru: I18N.ru.timeUpRecord, en: I18N.en.timeUpRecord } });
              clearControls();
              onTimeout && onTimeout();
            }, 0);
            return;
          }
          active = true;
          _total = ms;
          _remaining = ms;
          _onTimeout = onTimeout;
          DOM.timerWidget.classList.add("visible");
          DOM.timerFill.classList.remove("critical");
          DOM.timerWidget.classList.remove("critical");
          DOM.status.classList.remove("danger");
          updateStatus();
          const startTime = Date.now();
          function tick() {
            if (!active) return;
            _remaining = Math.max(0, _total - (Date.now() - startTime));
            const pct = (_remaining / _total) * 100;
            const secs = Math.ceil(_remaining / 1000);
            DOM.timerFill.style.width = pct + "%";
            DOM.timerDigits.textContent = secs + " " + L().timerSec;
            const critical = secs <= 3;
            if (critical) {
              DOM.timerFill.classList.add("critical");
              DOM.timerWidget.classList.add("critical");
              DOM.status.textContent = L().statusCritical;
              DOM.status.classList.add("danger");
            } else {
              DOM.timerFill.classList.remove("critical");
              DOM.timerWidget.classList.remove("critical");
            }
            if (_remaining <= 0) {
              stop();
              addMsg(L().timeUp, "danger");
              record("timeout", { message: { ru: I18N.ru.timeUpRecord, en: I18N.en.timeUpRecord } });
              clearControls();
              _onTimeout && _onTimeout();
              return;
            }
            rafId = requestAnimationFrame(tick);
          }
          rafId = requestAnimationFrame(tick);
        }

        function stop() {
          active = false;
          _onTimeout = null;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          DOM.timerWidget.classList.remove("visible");
          DOM.timerWidget.classList.remove("critical");
          DOM.status.classList.remove("danger");
          updateStatus();
        }

        return { start, stop, getRemaining, isActive, resumeFrom };
      })();

      /* ============================================================
         11. UI-ХЕЛПЕРЫ
         ============================================================ */
      function clearControls() {
        DOM.controls.innerHTML = "";
      }

      function addMsg(textOrObj, cls = "system") {
        const display = T(textOrObj);
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = display;
        DOM.log.appendChild(div);
        DOM.log.scrollTop = DOM.log.scrollHeight;
        record("msg", { text: toPair(textOrObj), cls });
      }

      function addLogEntry(textOrObj) {
        const display = T(textOrObj);
        const div = document.createElement("div");
        div.className = "msg log-entry";
        div.textContent = display;
        DOM.log.appendChild(div);
        DOM.log.scrollTop = DOM.log.scrollHeight;
        record("journal", { text: toPair(textOrObj) });
        refreshJournalModalIfOpen();
      }

      function addBatch(messages) {
        messages.forEach((m) => addMsg(m, m.c));
      }

      function updateStatus() {
        if (state.obedience >= 3 && state.doubt === 0) DOM.status.textContent = L().statusObedience;
        else if (state.doubt >= 3 && state.obedience === 0) DOM.status.textContent = L().statusDoubt;
        else if (state.doubt > 0) DOM.status.textContent = L().statusConflict;
        else DOM.status.textContent = L().statusNorm;
      }
      function updateJournalIndicator() {
        DOM.journalBtn.textContent = `📖 ${state.journalFound}/${CONFIG.maxJournalEntries}`;
        DOM.journalBtn.title = L().journalBtnTitle;
      }
      function updateDoctorIndicator() {
        if (state.awakenedDoctor) {
          DOM.doctorIndicator.textContent = L().doctorAwake;
          DOM.doctorIndicator.style.color = "var(--moral-btn-text)";
        } else {
          DOM.doctorIndicator.textContent = L().doctorSleeping;
          DOM.doctorIndicator.style.color = "var(--doctor)";
        }
        if (DOM.doctorStatusText) {
          DOM.doctorStatusText.textContent = state.awakenedDoctor
            ? L().doctorStatusAwake
            : L().doctorStatusSleeping;
        }
      }
      function button(label, action, cls = "") {
        const btn = document.createElement("button");
        btn.textContent = label;
        if (cls) btn.className = cls;
        btn.onclick = () => {
          Timer.stop();
          addMsg("> " + label, "choice");
          clearControls();
          action();
        };
        DOM.controls.appendChild(btn);
        return btn;
      }
      function pauseThen(fn) {
        button(L().continueBtn, fn);
      }
      function applyEffects(effects) {
        if (!effects) return;
        if (effects.obedience) state.obedience += effects.obedience;
        if (effects.doubt) state.doubt += effects.doubt;
        if (effects.journalDelta) {
          state.journalFound += effects.journalDelta;
          updateJournalIndicator();
        }
        if (effects.captainTrust) state.captainTrust += effects.captainTrust;
        if (effects.setFlags) {
          Object.assign(state, effects.setFlags);
          if (effects.setFlags.awakenedDoctor) updateDoctorIndicator();
        }
        updateStatus();
      }

      /* ============================================================
         12. BLACKOUT
         ============================================================ */
      function triggerBlackout(lines, onComplete) {
        DOM.blackoutOverlay.classList.add("active");
        DOM.blackoutText.textContent = "";
        DOM.blackoutText.classList.remove("visible");
        let i = 0;
        let intervalId = null;
        let completed = false;
        function finish() {
          if (completed) return;
          completed = true;
          if (intervalId) clearInterval(intervalId);
          DOM.skipBlackout.classList.remove("visible");
          DOM.blackoutText.classList.remove("visible");
          setTimeout(() => {
            DOM.blackoutOverlay.classList.remove("active");
            setTimeout(() => {
              DOM.blackoutText.textContent = "";
              onComplete();
            }, CONFIG.blackout.completeDelay);
          }, CONFIG.blackout.returnDelay);
        }
        function showLine(idx) {
          DOM.blackoutText.classList.remove("visible");
          setTimeout(() => {
            DOM.blackoutText.textContent = lines[idx];
            DOM.blackoutText.classList.add("visible");
          }, CONFIG.blackout.lineFade);
        }
        setTimeout(() => {
          if (completed) return;
          showLine(0);
          i = 1;
          DOM.skipBlackout.classList.add("visible");
          intervalId = setInterval(() => {
            if (i < lines.length) {
              showLine(i);
              i++;
            } else {
              clearInterval(intervalId);
              intervalId = null;
              setTimeout(finish, CONFIG.blackout.finalPause);
            }
          }, CONFIG.blackout.lineInterval);
        }, CONFIG.blackout.firstLineDelay);
        DOM.skipBlackout.onclick = finish;
      }

      /* ============================================================
         13. ДВИЖОК СЦЕНАРИЯ
         ============================================================ */
      function handleChoice(choice, onAfter) {
        record("choice", { label: toPair(choice.label) });
        applyEffects(choice);
        if (choice.journalText) addLogEntry(choice.journalText);
        if (choice.after) addBatch(choice.after);
        onAfter();
      }

        clearControls();

        addBatch(SCRIPT.act3Blackout.intro);

            triggerBlackout(SCRIPT.act3Blackout.lines[LANG], () => {
              DOM.game.classList.remove("blackout");
              DOM.log.innerHTML = "";
              addBatch(SCRIPT.act3Blackout.after);
              pauseThen(() => {
                addLogEntry(SCRIPT.act3Blackout.journal);
                state.journalFound++;
                state.doubt += 2;
                updateJournalIndicator();
                updateStatus();
                addBatch(SCRIPT.act3Blackout.afterJournal);
                pauseThen(() => {
                  addBatch(SCRIPT.act3Blackout.revelation);
                  state.captainIsAI = true;
                  pauseThen(act4);

          }, 1500);
        }, CONFIG.blackout.fadeDelay);

      function act4() {
        state.act = 4;
        record("act", { act: 4, name: { ru: I18N.ru.actNames[4], en: I18N.en.actNames[4] } });
        addBatch(SCRIPT.act4.intro);
        pauseThen(() => {
          addBatch(SCRIPT.act4.greeting);
          pauseThen(() => dialogNode("root"));
        });
      }

      function dialogNode(nodeId) {
        clearControls();
        const node = SCRIPT.act4.dialog[nodeId];
        addMsg(node.prompt, "system");
        if (node.question) addMsg(node.question, "unknown");
        node.choices.forEach((choice) => {
          let responses, trustGain;
          if (choice.conditional === "awakenedDoctor") {
            if (state.awakenedDoctor) {
              responses = choice.responsesTrue;
              trustGain = choice.captainTrustTrue;
            } else {
              responses = choice.responsesFalse;
              trustGain = 0;
            }
          } else {
            responses = choice.responses;
            trustGain = choice.captainTrust || 0;
          }
          button(
            T(choice.label),
            () => {
              record("choice", { label: toPair(choice.label), node: nodeId });
              const effects = {};
              if (choice.obedience) effects.obedience = choice.obedience;
              if (choice.doubt) effects.doubt = choice.doubt;
              if (trustGain) effects.captainTrust = trustGain;
              if (choice.setFlags) effects.setFlags = choice.setFlags;
              applyEffects(effects);
              addBatch(responses);
              if (choice.next) pauseThen(() => dialogNode(choice.next));
              else pauseThen(act5);
            },
            choice.cls || "",
          );
        });
      }

      function act5() {
        state.act = 5;
        record("act", { act: 5, name: { ru: I18N.ru.actNames[5], en: I18N.en.actNames[5] } });
        addBatch(SCRIPT.act5.intro);
        pauseThen(() => {
          addLogEntry(SCRIPT.act5.journal);
          state.journalFound++;
          updateJournalIndicator();
          updateStatus();
          pauseThen(() => {
            addBatch(SCRIPT.act5.after);
            const c = SCRIPT.act5.choices;
            button(T(c.chistilishe.label), () => ending("chistilishe"), c.chistilishe.cls);
            button(T(c.buntar.label), () => ending("buntar"), c.buntar.cls);
            if (state.awakenedDoctor) {
              button(T(c.third.label), () => ending("third"), c.third.cls);
            } else if (state.journalFound >= 3) {
              button(
                T(c.thirdFallback.label),
                () => {
                  Timer.stop();
                  L().act3FallbackMessages.forEach(([msg, cls]) => addMsg(msg, cls));
                  clearControls();
                  button(T(c.chistilishe.label), () => ending("chistilishe"), c.chistilishe.cls);
                  button(T(c.buntar.label), () => ending("buntar"), c.buntar.cls);
                  Timer.start(CONFIG.timerDurations.act5Fallback, () => ending("chistilishe"));
                },
                c.thirdFallback.cls,
              );
            }
            Timer.start(CONFIG.timerDurations.act5, () => {
              L().act5TimeoutMessages.forEach(([msg, cls]) => addMsg(msg, cls));
              ending("chistilishe");
            });
          });
        });
      }

      function ending(type) {
        Timer.stop();
        clearControls();
        DOM.log.innerHTML = "";
        record("ending", { type });
        addBatch(SCRIPT.endings[type]);
        addMsg("", "system");
        addMsg("...", "system");
        if (state.captainIsAI && SCRIPT.endings.epilogue[type]) {
          addMsg(L().endingSummary.voiceSilent, "unknown");
          addBatch(SCRIPT.endings.epilogue[type]);
        }
        addMsg("", "system");
        const s = L().endingSummary;
        addMsg(`Total: ${s.obedience} ${state.obedience}, ${s.doubt} ${state.doubt}, ${s.journal} ${state.journalFound}/${CONFIG.maxJournalEntries}`, "system");
        if (state.captainTrust > 0) addMsg(`${s.trust}: ${state.captainTrust}`, "system");
        if (state.captainHostile) addMsg(s.hostile, "system");
        if (state.awakenedDoctor) addMsg(s.doctorAlive, "system");
        if (state.captainIsAI) addMsg(s.captainAI, "unknown");

        const restart = document.createElement("div");
        restart.className = "restart";
        const btn = document.createElement("button");
        btn.textContent = L().restartBtn;
        btn.onclick = () => {
          if (!confirm(L().restartConfirm)) return;
          restartGame();
        };
        restart.appendChild(btn);
        DOM.controls.appendChild(restart);
      }

      /* ============================================================
         14. ЭКСПОРТ
         ============================================================ */
      function formatTimestamp(ts) {
        const d = new Date(ts);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }
      function formatDate(ts) {
        const d = new Date(ts);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function buildExportText() {
        const lines = [];
        const LINE = "=".repeat(60);
        const THIN = "-".repeat(60);
        const eh = L().exportHeader;
        const es = L().exportSummary;
        const ehst = L().exportHistory;
        const pm = L().prefixMap;

        lines.push(LINE);
        lines.push("  " + eh.title);
        lines.push("  " + eh.subtitle);
        lines.push(LINE);
        lines.push("");
        lines.push(`  ${eh.date}: ${formatDate(Date.now())}`);
        lines.push(`  ${eh.version}: ${L().brand}`);
        lines.push("");

        const endingRec = state.history.find((h) => h.type === "ending");
        const endingName = endingRec ? L().endingNames[endingRec.data.type] : L().endingNotDone;

        lines.push(THIN);
        lines.push("  " + es.title);
        lines.push(THIN);
        lines.push(`  ${es.ending}: ${endingName}`);
        lines.push(`  ${es.obedience}: ${state.obedience}`);
        lines.push(`  ${es.doubt}: ${state.doubt}`);
        lines.push(`  ${es.trust}: ${state.captainTrust}`);
        lines.push(`  ${es.journal}: ${state.journalFound}/${CONFIG.maxJournalEntries}`);
        lines.push(`  ${es.doctor}: ${state.awakenedDoctor ? es.yes : es.no}`);
        lines.push(`  ${es.hostile}: ${state.captainHostile ? es.yes : es.no}`);
        lines.push(`  ${es.nature}: ${state.captainIsAI ? es.memoryFragment : es.notRevealed}`);
        lines.push("");

        lines.push(THIN);
        lines.push("  " + ehst.title);
        lines.push(THIN);
        lines.push("");

        state.history.forEach((h) => {
          if (h.type === "act") {
            lines.push("");
            const name = typeof h.data.name === "object" ? T(h.data.name) : h.data.name;
            lines.push(`--- ${ehst.act} ${h.data.act}: ${name} ---`);
            lines.push("");
            return;
          }
          if (h.type === "msg") {
            const p = pm[h.data.cls] || "";
            const text = typeof h.data.text === "object" ? T(h.data.text) : h.data.text;
            lines.push(`[${formatTimestamp(h.timestamp)}] ${p ? p + " " : ""}${text}`);
            return;
          }
          if (h.type === "journal") {
            const text = typeof h.data.text === "object" ? T(h.data.text) : h.data.text;
            lines.push(`[${formatTimestamp(h.timestamp)}] ${ehst.journal}`);
            lines.push(`    ${text}`);
            lines.push("");
            return;
          }
          if (h.type === "choice") {
            const label = typeof h.data.label === "object" ? T(h.data.label) : h.data.label;
            lines.push(`[${formatTimestamp(h.timestamp)}] ${ehst.choice} ${label}`);
            return;
          }
          if (h.type === "timeout") {
            const msg = typeof h.data.message === "object" ? T(h.data.message) : h.data.message;
            lines.push(`[${formatTimestamp(h.timestamp)}] ⏱ ${msg}`);
            return;
          }
          if (h.type === "ending") {
            lines.push("");
            lines.push(`[${formatTimestamp(h.timestamp)}] ${ehst.ending} ${endingName}`);
            return;
          }
        });

        lines.push("");
        lines.push(LINE);
        lines.push("  " + ehst.end);
        lines.push(LINE);
        return lines.join("\n");
      }

      function showExportModal() {
        DOM.exportPreview.textContent = buildExportText();
        DOM.exportModal.classList.add("active");
      }
      function hideExportModal() {
        DOM.exportModal.classList.remove("active");
      }

      function downloadExport() {
        const text = buildExportText();
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const date = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const filename = `purgatory_${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}.txt`;
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        hideExportModal();
      }
      async function copyExport() {
        const text = buildExportText();
        try {
          await navigator.clipboard.writeText(text);
          DOM.exportCopy.textContent = L().exportCopied;
          setTimeout(() => {
            DOM.exportCopy.textContent = L().exportCopy;
          }, 1500);
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            DOM.exportCopy.textContent = L().exportCopied;
            setTimeout(() => {
              DOM.exportCopy.textContent = L().exportCopy;
            }, 1500);
          } catch (err) {
            DOM.exportCopy.textContent = L().exportError;
            setTimeout(() => {
              DOM.exportCopy.textContent = L().exportCopy;
            }, 1500);
          }
          document.body.removeChild(ta);
        }
      }

      function initExport() {
        DOM.exportBtn.onclick = showExportModal;
        DOM.exportClose.onclick = hideExportModal;
        DOM.exportCancel.onclick = hideExportModal;
        DOM.exportDownload.onclick = downloadExport;
        DOM.exportCopy.onclick = copyExport;
        DOM.exportModal.onclick = (e) => {
          if (e.target === DOM.exportModal) hideExportModal();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && DOM.exportModal.classList.contains("active")) hideExportModal();
        });
      }

      /* ============================================================
         15. МОДАЛКА ДОКТОРА
         ============================================================ */
      function openDoctorModal() {
        updateDoctorIndicator();
        DOM.doctorModal.classList.add("active");
      }
      function closeDoctorModal() {
        DOM.doctorModal.classList.remove("active");
      }
      function initDoctorModal() {
        DOM.doctorIndicator.onclick = openDoctorModal;
        DOM.doctorClose.onclick = closeDoctorModal;
        DOM.doctorModal.onclick = (e) => {
          if (e.target === DOM.doctorModal) closeDoctorModal();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && DOM.doctorModal.classList.contains("active")) closeDoctorModal();
        });
      }

      /* ============================================================
         16. МОДАЛКА ЖУРНАЛА
         ============================================================ */
      function renderJournalModal() {
        const l = L();
        DOM.journalList.innerHTML = "";
        const entries = state.history.filter((h) => h.type === "journal");
        if (entries.length === 0) {
          const empty = document.createElement("div");
          empty.id = "journal-empty";
          empty.textContent = l.journalModalEmpty;
          DOM.journalList.appendChild(empty);
          return;
        }
        entries.forEach((h, idx) => {
          const item = document.createElement("div");
          item.className = "journal-item";

          const head = document.createElement("div");
          head.className = "journal-item-head";
          head.textContent = `${l.journalEntryLabel} ${idx + 1} · ${formatTimestamp(h.timestamp)}`;

          const text = document.createElement("div");
          text.className = "journal-item-text";
          text.textContent = typeof h.data.text === "object" ? T(h.data.text) : h.data.text;

          item.appendChild(head);
          item.appendChild(text);
          DOM.journalList.appendChild(item);
        });
        DOM.journalList.scrollTop = 0;
      }

      function refreshJournalModalIfOpen() {
        if (DOM.journalModal && DOM.journalModal.classList.contains("active")) renderJournalModal();
      }

      function openJournalModal() {
        renderJournalModal();
        DOM.journalModal.classList.add("active");
      }
      function closeJournalModal() {
        DOM.journalModal.classList.remove("active");
      }
      function initJournalModal() {
        DOM.journalBtn.onclick = openJournalModal;
        DOM.journalClose.onclick = closeJournalModal;
        DOM.journalModal.onclick = (e) => {
          if (e.target === DOM.journalModal) closeJournalModal();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && DOM.journalModal.classList.contains("active")) closeJournalModal();
        });
      }

      /* ============================================================
         17. СТАРТ / РЕСТАРТ / ВОЗОБНОВЛЕНИЕ
         ============================================================ */
      function restartGame() {
        Timer.stop();
        state = createInitialState();
        DOM.game.classList.remove("blackout");
        DOM.blackoutOverlay.classList.remove("active");
        DOM.blackoutText.textContent = "";
        DOM.skipBlackout.classList.remove("visible");
        DOM.journalModal.classList.remove("active");
        DOM.log.innerHTML = "";
        clearControls();
        updateStatus();
        updateJournalIndicator();
        updateDoctorIndicator();
        act1();
      }

      function resumeFromCheckpoint() {
        const remaining = Timer.isActive() ? Timer.getRemaining() : 0;
        const wasActive = Timer.isActive();
        Timer.stop();
        DOM.game.classList.remove("blackout");
        DOM.blackoutOverlay.classList.remove("active");
        DOM.skipBlackout.classList.remove("visible");
        DOM.log.innerHTML = "";
        clearControls();

        switch (state.act) {
          case 1:
            act1();
            restoreTimerIfNeeded(wasActive, remaining, CONFIG.timerDurations.act1, () => {
              const c = SCRIPT.act1.choices;
              handleChoice(c.timeout, () => pauseThen(act2));
            });
            break;
          case 2:
            act2();
            break;
          case 3:
            act3();
            restoreTimerIfNeeded(wasActive, remaining, CONFIG.timerDurations.act3, () => {
              const c = SCRIPT.act3.choices;
              handleChoice(c.timeout, act3Blackout);
            });
            break;
          case 3.5:
            act3Blackout();
            break;
          case 4:
            act4();
            break;
          case 5:
            act5();
            restoreTimerIfNeeded(wasActive, remaining, CONFIG.timerDurations.act5, () => {
              L().act5TimeoutMessages.forEach(([msg, cls]) => addMsg(msg, cls));
              ending("chistilishe");
            });
            break;
          default:
            act1();
        }
      }

      function restoreTimerIfNeeded(wasActive, remaining, total, onTimeout) {
        if (!wasActive) return;
        setTimeout(() => {
          Timer.resumeFrom(remaining, onTimeout);
        }, 0);
      }

      function init() {
        initTheme();
        initLanguage();
        initExport();
        initDoctorModal();
        initJournalModal();
        updateStatus();
        updateJournalIndicator();
        updateDoctorIndicator();
        act1();
      }

      init();
    </script>
  </body>
</html>
