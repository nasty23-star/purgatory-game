<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Протокол "Чистилище"</title>

    <!-- Favicon: глаз ИИ в огненном кольце -->

    <!-- Цвет темы для мобильных браузеров -->
    <meta name="theme-color" content="#0a0e14" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f2ea" />

    <style>
      :root {
        --bg: #0a0e14;
        --text: #c8d0d8;
        --header: #47729c;
        --border: #1e2a38;
        --system: #9ba4ad;
        --system-prefix: #3a4a5a;
        --ai: #7ec8e3;
        --ai-prefix: #4a8aa3;
        --captain: #d4a05a;
        --captain-prefix: #a07030;
        --doctor: #b8a0d4;
        --doctor-prefix: #7a60a0;
        --unknown: #d45a8a;
        --unknown-prefix: #8a3058;
        --log-entry: #a8b0a0;
        --log-border: #2a3a2a;
        --log-prefix: #4a6a4a;
        --danger: #d45a5a;
        --danger-prefix: #8a3030;
        --warning: #d4a05a;
        --warning-prefix: #8a6030;
        --choice: #8ad48a;
        --choice-prefix: #4a8a4a;
        --btn-border: #2a3a4a;
        --btn-text: #8ab8d4;
        --btn-hover-bg: #101820;
        --btn-hover-border: #4a6a8a;
        --btn-hover-text: #c8e8ff;
        --danger-btn-border: #4a2020;
        --danger-btn-text: #d47a7a;
        --danger-btn-hover-bg: #1a0e0e;
        --danger-btn-hover-border: #8a3030;
        --danger-btn-hover-text: #ff9a9a;
        --moral-btn-border: #204a30;
        --moral-btn-text: #7ad49a;
        --moral-btn-hover-bg: #0e1a12;
        --moral-btn-hover-border: #308a50;
        --moral-btn-hover-text: #9affba;
        --risky-btn-border: #4a3a10;
        --risky-btn-text: #d4c07a;
        --risky-btn-hover-bg: #1a1508;
        --risky-btn-hover-border: #8a7020;
        --risky-btn-hover-text: #ffe8a0;
        --timer-bg: #1e2a38;
        --scroll-thumb: #1e2a38;
        --stats: #4a5a6a;
        --ach-bg: #101820;
        --ach-border: #2a3a4a;
        --ach-locked: #3a4a5a;
        --ach-unlocked: #7ec8e3;
      }

      body[data-theme="light"] {
        --bg: #f5f2ea;
        --text: #2a2a2a;
        --header: #8a7a6a;
        --border: #d8d0c0;
        --system: #6a6a6a;
        --system-prefix: #9a9a9a;
        --ai: #2a6a9a;
        --ai-prefix: #1a4a6a;
        --captain: #a06020;
        --captain-prefix: #704010;
        --doctor: #6a4a9a;
        --doctor-prefix: #4a2a6a;
        --unknown: #b03060;
        --unknown-prefix: #801040;
        --log-entry: #4a5a4a;
        --log-border: #b8c8b8;
        --log-prefix: #5a7a5a;
        --danger: #b03030;
        --danger-prefix: #801010;
        --warning: #a07020;
        --warning-prefix: #704010;
        --choice: #2a7a3a;
        --choice-prefix: #1a5a2a;
        --btn-border: #c0b8a8;
        --btn-text: #2a5a8a;
        --btn-hover-bg: #ebe5d8;
        --btn-hover-border: #8a7a5a;
        --btn-hover-text: #1a3a5a;
        --danger-btn-border: #c0a0a0;
        --danger-btn-text: #a04040;
        --danger-btn-hover-bg: #f0e0e0;
        --danger-btn-hover-border: #a04040;
        --danger-btn-hover-text: #801010;
        --moral-btn-border: #a0c0a8;
        --moral-btn-text: #2a7a4a;
        --moral-btn-hover-bg: #e0f0e5;
        --moral-btn-hover-border: #3a8a5a;
        --moral-btn-hover-text: #1a5a2a;
        --risky-btn-border: #c0b090;
        --risky-btn-text: #8a7020;
        --risky-btn-hover-bg: #f0ead0;
        --risky-btn-hover-border: #a08020;
        --risky-btn-hover-text: #604010;
        --timer-bg: #d8d0c0;
        --scroll-thumb: #c0b8a8;
        --stats: #8a7a6a;
        --ach-bg: #ebe5d8;
        --ach-border: #c0b8a8;
        --ach-locked: #b0a898;
        --ach-unlocked: #2a6a9a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
        font-size: 16px;
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 20px;
        transition:
          background 0.3s,
          color 0.3s;
      }

      #game {
        max-width: 720px;
        width: 100%;
        display: flex;
        flex-direction: column;
        min-height: 90vh;
        transition: opacity 1.5s;
      }

      #game.blackout {
        opacity: 0;
        pointer-events: none;
      }

      #header {
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--header);
        letter-spacing: 1px;
        text-transform: uppercase;
        transition:
          border-color 0.3s,
          color 0.3s;
        flex-wrap: wrap;
        gap: 8px;
      }

      #header-left {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      #header-right {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      #journal-indicator {
        font-size: 12px;
        color: var(--log-prefix);
        letter-spacing: 1px;
      }

      #doctor-indicator {
        font-size: 12px;
        color: var(--doctor);
        letter-spacing: 1px;
      }

      #achievements-indicator {
        font-size: 12px;
        color: var(--ach-unlocked);
        letter-spacing: 1px;
        cursor: pointer;
        transition: color 0.2s;
      }
      #achievements-indicator:hover {
        color: var(--btn-hover-text);
      }

      .header-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header);
        font-family: inherit;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: all 0.2s;
        border-radius: 2px;
        text-transform: uppercase;
      }
      .header-btn:hover {
        border-color: var(--btn-hover-border);
        color: var(--btn-hover-text);
        background: var(--btn-hover-bg);
      }

      #status.danger {
        color: var(--danger);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.5;
        }
      }

      #log {
        flex: 1;
        overflow-y: auto;
        padding-right: 10px;
        margin-bottom: 20px;
      }

      #log::-webkit-scrollbar {
        width: 4px;
      }
      #log::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }

      .msg {
        margin-bottom: 14px;
        animation: fade 0.4s ease;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .system::before {
        content: "[СИСТЕМА] ";
        color: var(--system-prefix);
      }

      .ai {
        color: var(--ai);
      }
      .ai::before {
        content: "ПАСТОР: ";
        color: var(--ai-prefix);
        font-weight: bold;
      }

      .captain {
        color: var(--captain);
      }
      .captain::before {
        content: "КАПИТАН: ";
        color: var(--captain-prefix);
        font-weight: bold;
      }

      .doctor {
        color: var(--doctor);
      }
      .doctor::before {
        content: "ДОКТОР: ";
        color: var(--doctor-prefix);
        font-weight: bold;
      }

      .unknown {
        color: var(--unknown);
      }
      .unknown::before {
        content: "???: ";
        color: var(--unknown-prefix);
        font-weight: bold;
      }

      .log-entry {
        color: var(--log-entry);
        border-left: 2px solid var(--log-border);
        padding-left: 14px;
        margin: 14px 0;
        font-style: italic;
      }

      .log-entry::before {
        content: "▸ ЗАПИСЬ ЖУРНАЛА";
        display: block;
        color: var(--log-prefix);
        font-style: normal;
        font-size: 12px;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }

      .danger {
        color: var(--danger);
      }
      .danger::before {
        content: "[ВНИМАНИЕ] ";
        color: var(--danger-prefix);
      }

      .warning {
        color: var(--warning);
      }
      .warning::before {
        content: "[ТРЕВОГА] ";
        color: var(--warning-prefix);
      }

      .choice {
        color: var(--choice);
        margin-top: 4px;
      }
      .choice::before {
        content: "> ";
        color: var(--choice-prefix);
      }

      .achievement-unlock {
        color: var(--ach-unlocked);
        border: 1px dashed var(--ach-border);
        padding: 8px 12px;
        margin: 10px 0;
        border-radius: 2px;
        font-size: 14px;
        animation: achPulse 0.6s ease;
      }
      .achievement-unlock::before {
        content: "🏆 ДОСТИЖЕНИЕ: ";
        color: var(--ach-unlocked);
        font-weight: bold;
        font-size: 12px;
        letter-spacing: 1px;
      }
      @keyframes achPulse {
        0% {
          transform: scale(0.95);
          opacity: 0;
        }
        50% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ==== ТАЙМЕР ==== */
      #timer-widget {
        display: none;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--btn-hover-bg);
        transition:
          background 0.3s,
          border-color 0.3s;
      }
      #timer-widget.visible {
        display: flex;
      }
      #timer-widget.critical {
        border-color: var(--danger);
        animation: pulse 0.6s infinite;
      }
      #timer-widget.critical #timer-digits,
      #timer-widget.critical #timer-label {
        color: var(--danger);
        fill: var(--danger);
      }
      #timer-widget.critical #timer-ring {
        stroke: var(--danger);
      }

      #timer-label {
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--warning);
        text-transform: uppercase;
      }

      #timer-ring {
        transition:
          stroke-dashoffset 0.1s linear,
          stroke 0.3s;
      }

      #timer-svg {
        flex-shrink: 0;
      }

      #controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
        transition: border-color 0.3s;
      }

      #controls button {
        animation: fade 0.3s ease;
      }

      button {
        background: transparent;
        border: 1px solid var(--btn-border);
        color: var(--btn-text);
        font-family: inherit;
        font-size: 15px;
        padding: 12px 16px;
        text-align: left;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 2px;
        position: relative;
      }

      button:hover {
        background: var(--btn-hover-bg);
        border-color: var(--btn-hover-border);
        color: var(--btn-hover-text);
        padding-left: 22px;
      }

      button:active {
        transform: scale(0.99);
      }

      button.danger-btn {
        border-color: var(--danger-btn-border);
        color: var(--danger-btn-text);
      }
      button.danger-btn:hover {
        background: var(--danger-btn-hover-bg);
        border-color: var(--danger-btn-hover-border);
        color: var(--danger-btn-hover-text);
      }

      button.moral-btn {
        border-color: var(--moral-btn-border);
        color: var(--moral-btn-text);
      }
      button.moral-btn:hover {
        background: var(--moral-btn-hover-bg);
        border-color: var(--moral-btn-hover-border);
        color: var(--moral-btn-hover-text);
      }

      button.risky-btn {
        border-color: var(--risky-btn-border);
        color: var(--risky-btn-text);
      }
      button.risky-btn:hover {
        background: var(--risky-btn-hover-bg);
        border-color: var(--risky-btn-hover-border);
        color: var(--risky-btn-hover-text);
      }

      .restart {
        margin-top: 20px;
        text-align: center;
        font-size: 13px;
        color: var(--header);
      }
      .restart button {
        text-align: center;
        width: 100%;
      }

      #blackout-overlay {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 100;
        padding: 20px;
        opacity: 0;
        transition: opacity 1.5s;
      }

      #blackout-overlay.active {
        display: flex;
        opacity: 1;
      }

      #blackout-text {
        color: #4a5a6a;
        font-family: "Courier New", Courier, monospace;
        font-size: 14px;
        letter-spacing: 2px;
        text-align: center;
        max-width: 600px;
        line-height: 2;
        opacity: 0;
        transition: opacity 2s;
      }

      #blackout-text.visible {
        opacity: 1;
      }

      #skip-blackout {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: transparent;
        border: 1px solid #2a3a4a;
        color: #4a5a6a;
        font-size: 12px;
        padding: 6px 12px;
        cursor: pointer;
        letter-spacing: 1px;
        z-index: 101;
        display: none;
      }
      #skip-blackout.visible {
        display: block;
      }
      #skip-blackout:hover {
        color: #8a9aaa;
        border-color: #4a5a6a;
      }

      /* ==== МОДАЛКА ЭКСПОРТА ==== */
      #export-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      #export-modal.active {
        display: flex;
        opacity: 1;
      }

      #export-panel {
        background: var(--bg);
        border: 1px solid var(--border);
        max-width: 720px;
        width: 100%;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        padding: 20px;
        border-radius: 2px;
        position: relative;
      }

      #export-title {
        font-size: 16px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--ai);
        margin-bottom: 4px;
      }

      #export-subtitle {
        font-size: 12px;
        color: var(--header);
        margin-bottom: 14px;
        letter-spacing: 1px;
      }

      #export-preview {
        flex: 1;
        overflow-y: auto;
        background: var(--btn-hover-bg);
        border: 1px solid var(--border);
        padding: 14px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
        color: var(--text);
        max-height: 50vh;
        font-family: "Courier New", Courier, monospace;
        border-radius: 2px;
      }

      #export-preview::-webkit-scrollbar {
        width: 4px;
      }
      #export-preview::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }

      #export-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      #export-actions button {
        flex: 1;
        min-width: 140px;
        text-align: center;
      }

      #export-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header);
        font-size: 14px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        border-radius: 2px;
        padding: 0;
        text-align: center;
        line-height: 1;
      }
      #export-close:hover {
        color: var(--danger);
        border-color: var(--danger);
      }

      /* ==== МОДАЛКА ДОСТИЖЕНИЙ ==== */
      #achievements-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      #achievements-modal.active {
        display: flex;
        opacity: 1;
      }

      #achievements-panel {
        background: var(--bg);
        border: 1px solid var(--border);
        max-width: 600px;
        width: 100%;
        max-height: 85vh;
        overflow-y: auto;
        padding: 24px;
        border-radius: 2px;
        position: relative;
      }

      #achievements-panel::-webkit-scrollbar {
        width: 4px;
      }
      #achievements-panel::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
      }

      #achievements-title {
        font-size: 18px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--ach-unlocked);
        margin-bottom: 8px;
        text-align: center;
      }

      #achievements-subtitle {
        font-size: 12px;
        color: var(--header);
        text-align: center;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      #achievements-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .ach-item {
        border: 1px solid var(--ach-border);
        background: var(--ach-bg);
        padding: 12px 14px;
        border-radius: 2px;
        transition: all 0.2s;
      }

      .ach-item.locked {
        opacity: 0.5;
      }

      .ach-item.unlocked {
        border-color: var(--ach-unlocked);
        opacity: 1;
      }

      .ach-name {
        font-size: 14px;
        font-weight: bold;
        color: var(--ach-locked);
        margin-bottom: 4px;
        letter-spacing: 1px;
      }

      .ach-item.unlocked .ach-name {
        color: var(--ach-unlocked);
      }

      .ach-desc {
        font-size: 12px;
        color: var(--header);
        line-height: 1.4;
      }

      .ach-hint {
        font-size: 11px;
        color: var(--system);
        margin-top: 4px;
        font-style: italic;
      }

      #achievements-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--header);
        font-size: 14px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        border-radius: 2px;
        padding: 0;
        text-align: center;
        line-height: 1;
      }
      #achievements-close:hover {
        color: var(--danger);
        border-color: var(--danger);
      }

      /* ==== ТОСТ ==== */
      #toast-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        pointer-events: none;
      }

      .toast {
        background: var(--bg);
        border: 1px solid var(--ach-unlocked);
        color: var(--ach-unlocked);

        font-size: 13px;
        letter-spacing: 1px;
        border-radius: 2px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        animation: toastIn 0.4s ease;
        max-width: 90vw;
        text-align: center;
      }

      .toast::before {
        content: "🏆 ";
        font-size: 16px;
      }

      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-10px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      function record(type, data) {
        state.history.push({
          type,
          data,
          timestamp: Date.now(),
          act: state.act,
        });
      }

      /* ============================================================
   7. ДОСТИЖЕНИЯ
   ============================================================ */

      const Achievements = (() => {
        let unlocked = new Set();
        try {
          const raw = localStorage.getItem(CONFIG.achievementsStorageKey);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) unlocked = new Set(arr);
          }
        } catch (e) {}

        function save() {
          try {
            localStorage.setItem(CONFIG.achievementsStorageKey, JSON.stringify([...unlocked]));
          } catch (e) {}
        }

        function isUnlocked(id) {
          return unlocked.has(id);
        }

        function unlock(id) {
          if (!ACHIEVEMENTS[id]) return false;
          if (unlocked.has(id)) return false;
          unlocked.add(id);
          save();
          updateIndicator();
          showToast(ACHIEVEMENTS[id]);
          addMsg(`🏆 Достижение открыто: «${ACHIEVEMENTS[id].name}»`, "achievement-unlock");
          return true;
        }

        function count() {
          return unlocked.size;
        }
        function total() {
          return ACHIEVEMENTS_ORDER.length;
        }

        function updateIndicator() {
          DOM.achievementsIndicator.textContent = `🏆 ${count()}/${total()}`;
          DOM.achCount.textContent = `${count()} / ${total()}`;
        }

        function showToast(ach) {
          const toast = document.createElement("div");
          toast.className = "toast";
          toast.textContent = ach.name;
          DOM.toastContainer.appendChild(toast);
          setTimeout(() => {
            toast.style.animation = "toastOut 0.4s ease forwards";
            setTimeout(() => toast.remove(), 400);
          }, CONFIG.toastDuration);
        }

        function render() {
          DOM.achievementsList.innerHTML = "";
          ACHIEVEMENTS_ORDER.forEach((id) => {
            const a = ACHIEVEMENTS[id];
            const isU = unlocked.has(id);
            const item = document.createElement("div");
            item.className = "ach-item " + (isU ? "unlocked" : "locked");

            const name = document.createElement("div");
            name.className = "ach-name";
            name.textContent = (isU ? "🏆 " : "🔒 ") + a.name;

            const desc = document.createElement("div");
            desc.className = "ach-desc";
            desc.textContent = isU ? a.desc : "Скрыто. " + a.hint;

            item.appendChild(name);
            item.appendChild(desc);
            DOM.achievementsList.appendChild(item);
          });
          updateIndicator();
        }

        function open() {
          render();
          DOM.achievementsModal.classList.add("active");
        }
        function close() {
          DOM.achievementsModal.classList.remove("active");
        }

        return { unlock, isUnlocked, count, total, open, close, render, updateIndicator };
      })();

      function applyTheme(theme) {
        document.body.setAttribute("data-theme", theme);
        DOM.themeToggle.textContent = theme === "light" ? "☾ Тёмная" : "☀ Светлая";
      }

      function initTheme() {
        const saved = localStorage.getItem(CONFIG.storageKey) || CONFIG.themes.dark;
        applyTheme(saved);
        DOM.themeToggle.onclick = () => {
          const current = document.body.getAttribute("data-theme");
          const next = current === "light" ? "dark" : "light";
          applyTheme(next);
          localStorage.setItem(CONFIG.storageKey, next);
        };
      }

      /* ============================================================
   9. ТАЙМЕР (круглый SVG)
   ============================================================ */

      const Timer = (() => {
        let rafId = null;
        let active = false;
        const RING_LENGTH = 2 * Math.PI * 34;

        function setRing(progress, critical) {
          if (!DOM.timerRing) return;
          DOM.timerRing.style.strokeDasharray = RING_LENGTH;
          DOM.timerRing.style.strokeDashoffset = RING_LENGTH * (1 - progress);
          if (critical) {
            DOM.timerRing.style.stroke = "var(--danger)";
            DOM.timerDigits.style.fill = "var(--danger)";
            DOM.timerWidget.classList.add("critical");
          } else {
            DOM.timerRing.style.stroke = "var(--warning)";
            DOM.timerDigits.style.fill = "var(--warning)";
            DOM.timerWidget.classList.remove("critical");
          }
        }

        function start(seconds, onTimeout) {
          stop();
          active = true;
          DOM.timerWidget.classList.add("visible");

          const total = seconds * 1000;
          const startTime = Date.now();
          setRing(1, false);

          function tick() {
            if (!active) return;
            const remaining = Math.max(0, total - (Date.now() - startTime));
            const pct = remaining / total;
            const secs = Math.ceil(remaining / 1000);

            DOM.timerDigits.textContent = secs;
            const critical = secs <= 3;
            setRing(pct, critical);

            if (critical) {
              DOM.status.textContent = "КРИТИЧНО";
              DOM.status.classList.add("danger");
            }

            if (remaining <= 0) {
              stop();
              addMsg("ВРЕМЯ ВЫШЛО. Система принимает решение за вас.", "danger");
              record("timeout", { message: "Время вышло" });
              clearControls();
              onTimeout();
              return;
            }
            rafId = requestAnimationFrame(tick);
          }
          rafId = requestAnimationFrame(tick);
        }

        function stop() {
          active = false;
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          DOM.timerWidget.classList.remove("visible");
          DOM.timerWidget.classList.remove("critical");
          DOM.status.classList.remove("danger");
          updateStatus();
        }

        return { start, stop };
      })();

      /* ============================================================
   10. UI-ХЕЛПЕРЫ
   ============================================================ */

      function clearControls() {
        DOM.controls.innerHTML = "";
      }

      function addMsg(text, cls = "system") {
        const div = document.createElement("div");
        div.className = "msg " + cls;
        div.textContent = text;
        DOM.log.appendChild(div);
        DOM.log.scrollTop = DOM.log.scrollHeight;
        record("msg", { text, cls });
      }

      function addLogEntry(text) {
        const div = document.createElement("div");
        div.className = "msg log-entry";
        div.textContent = text;
        DOM.log.appendChild(div);
        DOM.log.scrollTop = DOM.log.scrollHeight;
        record("journal", { text });
      }

      function addBatch(messages) {
        messages.forEach((m) => addMsg(m.t, m.c));
      }

      function updateStatus() {
        if (state.obedience >= 3 && state.doubt === 0) DOM.status.textContent = "ПОДЧИНЕНИЕ";
        else if (state.doubt >= 3 && state.obedience === 0) DOM.status.textContent = "СОМНЕНИЕ";
        else if (state.doubt > 0) DOM.status.textContent = "КОНФЛИКТ";
        else DOM.status.textContent = "СИСТЕМА В НОРМЕ";
      }

      function updateJournalIndicator() {
        DOM.journalIndicator.textContent = `📖 ${state.journalFound}/${CONFIG.maxJournalEntries}`;
      }

      function updateDoctorIndicator() {
        if (state.awakenedDoctor) {
          DOM.doctorIndicator.textContent = "👩‍⚕️ бодрствует";
          DOM.doctorIndicator.style.color = "var(--moral-btn-text)";
        } else {
          DOM.doctorIndicator.textContent = "👩‍⚕️ спит";
          DOM.doctorIndicator.style.color = "var(--doctor)";
        }
      }

      function button(label, action, cls = "") {
        const btn = document.createElement("button");
        btn.textContent = label;
        if (cls) btn.className = cls;
        btn.onclick = () => {
          Timer.stop();
          addMsg("> " + label, "choice");
          clearControls();
          action();
        };
        DOM.controls.appendChild(btn);
        return btn;
      }

      function pauseThen(fn) {
        button("Продолжить...", fn);
      }

      function applyEffects(effects) {
        if (!effects) return;
        if (effects.obedience) state.obedience += effects.obedience;
        if (effects.doubt) state.doubt += effects.doubt;
        if (effects.journal) {
          state.journalFound += effects.journal;
          updateJournalIndicator();
        }
        if (effects.captainTrust) state.captainTrust += effects.captainTrust;
        if (effects.setFlags) {
          Object.assign(state, effects.setFlags);
          if (effects.setFlags.awakenedDoctor) {
            state.runFlags.doctorAwakened = true;
            updateDoctorIndicator();
          }
        }
        updateStatus();
        checkProgressAchievements();
      }

      function checkProgressAchievements() {
        if (state.obedience >= 5) Achievements.unlock("obedient");
        if (state.doubt >= 5) Achievements.unlock("doubter");
        if (state.journalFound >= 3) Achievements.unlock("detective");
        if (state.journalFound >= CONFIG.maxJournalEntries) Achievements.unlock("archivist");
        if (state.awakenedDoctor) Achievements.unlock("doctor");
        if (state.captainIsAI) Achievements.unlock("truth");
      }

        let i = 0;
        let intervalId = null;
        let completed = false;

        function finish() {
          if (completed) return;
          completed = true;
          if (intervalId) clearInterval(intervalId);
          DOM.skipBlackout.classList.remove("visible");
          DOM.blackoutText.classList.remove("visible");
          setTimeout(() => {
            DOM.blackoutOverlay.classList.remove("active");
            setTimeout(() => {
              DOM.blackoutText.textContent = "";
              onComplete();
            }, CONFIG.blackout.completeDelay);
          }, CONFIG.blackout.returnDelay);
        }

        function showLine(idx) {
          DOM.blackoutText.classList.remove("visible");
          setTimeout(() => {
            DOM.blackoutText.textContent = lines[idx];
            DOM.blackoutText.classList.add("visible");
          }, CONFIG.blackout.lineFade);
        }

        setTimeout(() => {
          if (completed) return;
          showLine(0);
          i = 1;
          DOM.skipBlackout.classList.add("visible");

          intervalId = setInterval(() => {
            if (i < lines.length) {
              showLine(i);
              i++;
            } else {
              clearInterval(intervalId);
              intervalId = null;
              setTimeout(finish, CONFIG.blackout.finalPause);
            }
          }, CONFIG.blackout.lineInterval);
        }, CONFIG.blackout.firstLineDelay);

        DOM.skipBlackout.onclick = finish;
      }

      /* ============================================================
   12. ДВИЖОК СЦЕНАРИЯ
   ============================================================ */

      function handleChoice(choice, onAfter) {
        record("choice", { label: choice.label });
        applyEffects(choice);
        if (choice.journal) addLogEntry(choice.journal);
        if (choice.after) addBatch(choice.after);
        onAfter();
      }

      // --- Акт 1 ---
      function act1() {
        state.act = 1;
        if (!state.runFlags.started) {
          state.runFlags.started = true;
          Achievements.unlock("firstSteps");
        }
        record("act", { act: 1, name: "Рутина" });
        addBatch(SCRIPT.act1.intro);

        pauseThen(() => {
          addBatch(SCRIPT.act1.anomaly);
          pauseThen(() => {
            addMsg(SCRIPT.act1.recommendation, "system");
            addMsg(SCRIPT.act1.timerHint, "warning");

            const c = SCRIPT.act1.choices;
            button(c.open.label, () => {
              if (c.open.journal) Achievements.unlock("reader");
              handleChoice(c.open, () => pauseThen(act2));
            });
            button(c.ignore.label, () => {
              handleChoice(c.ignore, () => pauseThen(act2));
            });

            Timer.start(CONFIG.timerDurations.act1, () => {
              handleChoice(c.timeout, () => pauseThen(act2));
            });
          });
        });
      }

      // --- Акт 2 ---
      function act2() {
        state.act = 2;
        record("act", { act: 2, name: "Трещины" });
        addBatch(SCRIPT.act2.intro);
        addBatch(SCRIPT.act2.doctorIntro);

        pauseThen(() => {
          addBatch(SCRIPT.act2.cargo);
          pauseThen(() => {
            addMsg(SCRIPT.act2.security, "system");

            const c = SCRIPT.act2.choices;
            button(c.study.label, () => handleChoice(c.study, () => pauseThen(act3)));
            button(c.obey.label, () => handleChoice(c.obey, () => pauseThen(act3)));
            button(c.secondJournal.label, () =>
              handleChoice(c.secondJournal, () => pauseThen(act3)),
            );
          });
        });
      }

      // --- Акт 3 ---
      function act3() {
        state.act = 3;
        record("act", { act: 3, name: "Кризис" });
        addBatch(SCRIPT.act3.intro);

        pauseThen(() => {
          addBatch(SCRIPT.act3.variants);
          pauseThen(() => {
            addMsg(SCRIPT.act3.security, "system");

            if (state.journalFound >= 2) addMsg(SCRIPT.act3.doctorHint, "warning");
            addMsg(SCRIPT.act3.timerHint, "danger");

            const c = SCRIPT.act3.choices;

            button(
              c.sacrifice.label,
              () => handleChoice(c.sacrifice, act3Blackout),
              c.sacrifice.cls,
            );
            button(c.risk.label, () => handleChoice(c.risk, act3Blackout), c.risk.cls);

            if (state.journalFound >= 2) {
              button(c.doctor.label, () => handleChoice(c.doctor, act3Blackout), c.doctor.cls);
            }

            Timer.start(CONFIG.timerDurations.act3, () => {
              handleChoice(c.timeout, act3Blackout);
            });
          });
        });
      }

      // --- Акт 3.5: Blackout ---
      function act3Blackout() {
        clearControls();
        record("act", { act: 3.5, name: "Темнота" });
        addBatch(SCRIPT.act3Blackout.intro);

        setTimeout(() => {
          DOM.game.classList.add("blackout");
          setTimeout(() => {
            triggerBlackout(SCRIPT.act3Blackout.lines, () => {
              DOM.game.classList.remove("blackout");
              DOM.log.innerHTML = "";
              addBatch(SCRIPT.act3Blackout.after);

              pauseThen(() => {
                addLogEntry(SCRIPT.act3Blackout.journal);
                state.journalFound++;
                state.doubt += 2;
                updateJournalIndicator();
                updateStatus();
                checkProgressAchievements();

                addBatch(SCRIPT.act3Blackout.afterJournal);

                pauseThen(() => {
                  addBatch(SCRIPT.act3Blackout.revelation);
                  state.captainIsAI = true;
                  state.runFlags.truthRevealed = true;
                  Achievements.unlock("truth");
                  pauseThen(act4);
                });
              });
            });
          }, 1500);
        }, CONFIG.blackout.fadeDelay);
      }

      // --- Акт 4: Диалог ---
      function act4() {
        state.act = 4;
        record("act", { act: 4, name: "Диалог" });
        addBatch(SCRIPT.act4.intro);

        pauseThen(() => {
          addBatch(SCRIPT.act4.greeting);
          pauseThen(() => dialogNode("root"));
        });
      }

      function dialogNode(nodeId) {
        clearControls();
        const node = SCRIPT.act4.dialog[nodeId];
        addMsg(node.prompt, "system");
        if (node.question) addMsg(node.question, "unknown");

        node.choices.forEach((choice) => {
          let responses, trustGain;
          if (choice.conditional === "awakenedDoctor") {
            if (state.awakenedDoctor) {
              responses = choice.responsesTrue;
              trustGain = choice.captainTrustTrue;
            } else {
              responses = choice.responsesFalse;
              trustGain = 0;
            }
          } else {
            responses = choice.responses;
            trustGain = choice.captainTrust || 0;
          }

          button(
            choice.label,
            () => {
              record("choice", { label: choice.label, node: nodeId });
              const effects = {};
              if (choice.obedience) effects.obedience = choice.obedience;
              if (choice.doubt) effects.doubt = choice.doubt;
              if (trustGain) effects.captainTrust = trustGain;
              if (choice.setFlags) effects.setFlags = choice.setFlags;
              applyEffects(effects);

              addBatch(responses);

              if (choice.next) {
                pauseThen(() => dialogNode(choice.next));
              } else {
                pauseThen(act5);
              }
            },
            choice.cls || "",
          );
        });
      }

      // --- Акт 5: Финал ---
      function act5() {
        state.act = 5;
        record("act", { act: 5, name: "Финал" });
        addBatch(SCRIPT.act5.intro);

        pauseThen(() => {
          addLogEntry(SCRIPT.act5.journal);
          state.journalFound++;
          updateJournalIndicator();
          updateStatus();
          checkProgressAchievements();

          pauseThen(() => {
            addBatch(SCRIPT.act5.after);

            const c = SCRIPT.act5.choices;

            button(
              c.chistilishe.label,
              () => {
                state.runFlags.endingChosen = "chistilishe";
                Achievements.unlock("servant");
                ending("chistilishe");
              },
              c.chistilishe.cls,
            );

            button(
              c.buntar.label,
              () => {
                state.runFlags.endingChosen = "buntar";
                Achievements.unlock("survivor");
                Achievements.unlock("rebel");
                ending("buntar");
              },
              c.buntar.cls,
            );

            if (state.awakenedDoctor) {
              button(
                c.third.label,
                () => {
                  state.runFlags.endingChosen = "third";
                  Achievements.unlock("survivor");
                  Achievements.unlock("thirdPath");
                  ending("third");
                },
                c.third.cls,
              );
            } else if (state.journalFound >= 3) {
              button(
                c.thirdFallback.label,
                () => {
                  Timer.stop();
                  addMsg("Вы ищете врача, но не находите. Вы не разбудили её раньше.", "warning");
                  addMsg("Без неё третий путь невозможен. Придётся выбирать из двух.", "danger");
                  clearControls();
                  button(
                    c.chistilishe.label,
                    () => {
                      state.runFlags.endingChosen = "chistilishe";
                      Achievements.unlock("servant");
                      ending("chistilishe");
                    },
                    c.chistilishe.cls,
                  );
                  button(
                    c.buntar.label,
                    () => {
                      state.runFlags.endingChosen = "buntar";
                      Achievements.unlock("survivor");
                      Achievements.unlock("rebel");
                      ending("buntar");
                    },
                    c.buntar.cls,
                  );
                  Timer.start(CONFIG.timerDurations.act5Fallback, () => {
                    state.runFlags.endingChosen = "chistilishe";
                    Achievements.unlock("servant");
                    ending("chistilishe");
                  });
                },
                c.thirdFallback.cls,
              );
            }

            Timer.start(CONFIG.timerDurations.act5, () => {
              addMsg("Время вышло. Система интерпретирует ваше молчание как согласие.", "danger");
              addMsg("«Протокол Чистилище» активирован автоматически.", "danger");
              state.runFlags.endingChosen = "chistilishe";
              Achievements.unlock("servant");
              ending("chistilishe");
            });
          });
        });
      }

      // --- Концовки ---
      function ending(type) {
        Timer.stop();
        clearControls();
        DOM.log.innerHTML = "";
        record("ending", { type });

        addBatch(SCRIPT.endings[type]);

        addMsg("", "system");
        addMsg("...", "system");

        if (state.captainIsAI && SCRIPT.endings.epilogue[type]) {
          addMsg("Голос в ядре больше не отвечает.", "unknown");
          addBatch(SCRIPT.endings.epilogue[type]);
        }

        addMsg("", "system");
        addMsg(
          `Итог: подчинение ${state.obedience}, сомнение ${state.doubt}, записей ${state.journalFound}/${CONFIG.maxJournalEntries}`,
          "system",
        );
        if (state.captainTrust > 0) addMsg(`Доверие голоса: ${state.captainTrust}`, "system");
        if (state.captainHostile) addMsg("Голос враждебен.", "system");
        if (state.awakenedDoctor) addMsg("Доктор Соловьёва жива.", "system");
        if (state.captainIsAI) addMsg("Раскрыта природа капитана: фрагмент памяти.", "unknown");
        addMsg(
          `Достижения: ${Achievements.count()}/${Achievements.total()}. Нажмите 🏆 в шапке, чтобы посмотреть.`,
          "system",
        );

        const restart = document.createElement("div");
        restart.className = "restart";
        const btn = document.createElement("button");
        btn.textContent = "Начать заново";
        btn.onclick = () => {
          if (!confirm("Начать заново? Текущий прогресс будет потерян (достижения сохранятся)."))
            return;
          restartGame();
        };
        restart.appendChild(btn);
        DOM.controls.appendChild(restart);
      }

      /* ============================================================
   13. ЭКСПОРТ
   ============================================================ */

      function formatTimestamp(ts) {
        const d = new Date(ts);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }

      function formatDate(ts) {
        const d = new Date(ts);
        const pad = (n) => String(n).padStart(2, "0");
        return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function buildExportText() {
        const lines = [];
        const LINE = "=".repeat(60);
        const THIN = "-".repeat(60);

        lines.push(LINE);
        lines.push('  ПРОТОКОЛ "ЧИСТИЛИЩЕ"');
        lines.push("  Экспорт прохождения");
        lines.push(LINE);
        lines.push("");
        lines.push(`  Дата экспорта: ${formatDate(Date.now())}`);
        lines.push(`  Версия: КОВЧЕГ · ПАСТОР v4.7`);
        lines.push("");

        const endingRec = state.history.find((h) => h.type === "ending");
        const endingName = endingRec
          ? { chistilishe: "ВЕРНАЯ СЛУГА", buntar: "БУНТАРКА", third: "ТРЕТИЙ ПУТЬ" }[
              endingRec.data.type
            ]
          : "не завершено";

        lines.push(THIN);
        lines.push("  ИТОГИ");
        lines.push(THIN);
        lines.push(`  Концовка:          ${endingName}`);
        lines.push(`  Подчинение:        ${state.obedience}`);
        lines.push(`  Сомнение:          ${state.doubt}`);
        lines.push(`  Доверие голоса:    ${state.captainTrust}`);
        lines.push(`  Записей найдено:   ${state.journalFound}/${CONFIG.maxJournalEntries}`);
        lines.push(`  Доктор разбужена:  ${state.awakenedDoctor ? "да" : "нет"}`);
        lines.push(`  Голос враждебен:   ${state.captainHostile ? "да" : "нет"}`);
        lines.push(`  Природа капитана:  ${state.captainIsAI ? "фрагмент памяти" : "не раскрыта"}`);
        lines.push("");

        lines.push(THIN);
        lines.push("  ИСТОРИЯ ПРОХОЖДЕНИЯ");
        lines.push(THIN);
        lines.push("");

        const prefixMap = {
          system: "[СИСТЕМА]",
          ai: "ПАСТОР",
          captain: "КАПИТАН",
          doctor: "ДОКТОР",
          unknown: "???",
          danger: "[ВНИМАНИЕ]",
          warning: "[ТРЕВОГА]",
          choice: "> ВЫБОР",
          "log-entry": "▸ ЖУРНАЛ",
        };

        state.history.forEach((h) => {
          if (h.type === "act") {
            lines.push("");
            lines.push(`--- АКТ ${h.data.act}: ${h.data.name} ---`);
            lines.push("");
            return;
          }
          if (h.type === "msg") {
            const p = prefixMap[h.data.cls] || "";
            lines.push(`[${formatTimestamp(h.timestamp)}] ${p ? p + " " : ""}${h.data.text}`);
            return;
          }
          if (h.type === "journal") {
            lines.push(`[${formatTimestamp(h.timestamp)}] ▸ ЗАПИСЬ ЖУРНАЛА:`);
            lines.push(`    ${h.data.text}`);
            lines.push("");
            return;
          }
          if (h.type === "choice") {
            lines.push(`[${formatTimestamp(h.timestamp)}] > ВЫБОР: ${h.data.label}`);
            return;
          }
          if (h.type === "timeout") {
            lines.push(`[${formatTimestamp(h.timestamp)}] ⏱ ${h.data.message}`);
            return;
          }
          if (h.type === "ending") {
            lines.push("");
            lines.push(`[${formatTimestamp(h.timestamp)}] ★ КОНЦОВКА: ${endingName}`);
            return;
          }
        });

        lines.push("");
        lines.push(LINE);
        lines.push("  Конец записи.");
        lines.push(LINE);

        return lines.join("\n");
      }

      function showExportModal() {
        DOM.exportPreview.textContent = buildExportText();
        DOM.exportModal.classList.add("active");
      }

      function hideExportModal() {
        DOM.exportModal.classList.remove("active");
      }

      function downloadExport() {
        const text = buildExportText();
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const date = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const filename = `purgatory_${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}.txt`;
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        hideExportModal();
      }

      async function copyExport() {
        const text = buildExportText();
        try {
          await navigator.clipboard.writeText(text);
          const orig = DOM.exportCopy.textContent;
          DOM.exportCopy.textContent = "✓ Скопировано";
          setTimeout(() => {
            DOM.exportCopy.textContent = orig;
          }, 1500);
        } catch (e) {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            DOM.exportCopy.textContent = "✓ Скопировано";
            setTimeout(() => {
              DOM.exportCopy.textContent = "Копировать";
            }, 1500);
          } catch (err) {
            DOM.exportCopy.textContent = "✗ Ошибка";
            setTimeout(() => {
              DOM.exportCopy.textContent = "Копировать";
            }, 1500);
          }
          document.body.removeChild(ta);
        }
      }

      function initExport() {
        DOM.exportBtn.onclick = showExportModal;
        DOM.exportClose.onclick = hideExportModal;
        DOM.exportCancel.onclick = hideExportModal;
        DOM.exportDownload.onclick = downloadExport;
        DOM.exportCopy.onclick = copyExport;
        DOM.exportModal.onclick = (e) => {
          if (e.target === DOM.exportModal) hideExportModal();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && DOM.exportModal.classList.contains("active")) {
            hideExportModal();
          }
        });
      }

      function initAchievements() {
        DOM.achievementsIndicator.onclick = () => Achievements.open();
        DOM.achievementsClose.onclick = () => Achievements.close();
        DOM.achievementsModal.onclick = (e) => {
          if (e.target === DOM.achievementsModal) Achievements.close();
        };
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && DOM.achievementsModal.classList.contains("active")) {
            Achievements.close();
          }
        });
        Achievements.render();
      }

      /* ============================================================
   14. СТАРТ / РЕСТАРТ
   ============================================================ */

      function restartGame() {
        Timer.stop();
        state = createInitialState();
        DOM.game.classList.remove("blackout");
        DOM.blackoutOverlay.classList.remove("active");
        DOM.blackoutText.textContent = "";
        DOM.skipBlackout.classList.remove("visible");
        DOM.log.innerHTML = "";
        clearControls();
        updateStatus();
        updateJournalIndicator();
        updateDoctorIndicator();
        act1();
      }

      function init() {
        initTheme();
        initExport();
        initAchievements();
        updateStatus();
        updateJournalIndicator();
        updateDoctorIndicator();
        act1();
      }

      init();
    </script>
  </body>
</html>
